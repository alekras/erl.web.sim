
services:
  mqtt-service:
    image: mqtt_server_dev
    container_name: docker_container_a
    hostname: localhost
    tty: "true"
    environment:
      PORT_REST: 8080
      PORT_CLEAR: 18883
      PORT_TLS: 18483
      PORT_WS: 8880
      PORT_WSS: 4443
      NODE_NAME: mqtt_server
      CLUSTER_NODES: ""
      MNESIA_DIR: "/opt/mnesia_data"
      MNESIA_MASTER: "true"
      CERT_FILE: "tls_cnfg/server/cert.pem"
      CA_CERT_FILE: "tls_cnfg/server/cacerts.pem"
      KEY_FILE: "tls_cnfg/server/key.pem"
    ports:
      - "8080:8080"
      - "8880:8880"
    expose:
      - "8080"   # Internal PORT_REST port mqtt server listens on
      - "8880"   # Internal PORT_WS port mqtt server listens on
    volumes:
#      - mnesia-volume:/opt/mnesia_data
      - /opt/mqtt/server/mnesia:/opt/mnesia_data
    networks:
      - mqtt_net

  sim_web-service:
    image: sim_web_dev
    container_name: docker_container_b
    hostname: localhost
    tty: "true"
    environment:
      DETS_DIR: "/private/var/data/dets-storage"
      PORT_REST: 8000
      PORT_MQTT_WS: 8880
      HOST_MQTT: "docker_container_a"
      PORT_MQTT_REST: 8080
    ports:
      - "8000:8000"
    expose:
      - "8000"  # Internal port mqtt server listens on
    volumes:
#      - dets-volume:/private/var/data/dets-storage
      - /private/var/data/dets-storage:/private/var/data/dets-storage
    networks:
      - mqtt_net

networks:
  mqtt_net:
    driver: bridge

